<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 桌面即時浮窗</title>
  <style>
    :root {
      --bg: rgba(255, 255, 255, 0.84);
      --bg-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.90) 0%, rgba(246, 248, 252, 0.95) 100%);
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.05);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(0, 0, 0, 0.06);
      --hover-bg: rgba(0, 0, 0, 0.05);
      --accent-blue: #0284c7;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --shadow: 0 16px 36px -4px rgba(15, 23, 42, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: rgba(24, 24, 30, 0.85);
        --bg-gradient: linear-gradient(135deg, rgba(28, 28, 36, 0.92) 0%, rgba(18, 18, 24, 0.96) 100%);
        --border: rgba(255, 255, 255, 0.12);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.08);
        --hover-bg: rgba(255, 255, 255, 0.07);
        --shadow: 0 20px 45px -4px rgba(0, 0, 0, 0.5), 0 4px 14px -2px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12px;
      color: var(--text-main);
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }

    .widget-container {
      flex: 1;
      background: var(--bg-gradient);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Header */
    .header {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag;
      cursor: grab;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header:active {
      cursor: grabbing;
    }

    .status-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 11px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .status-capsule.idle .pulse-dot {
      background-color: var(--text-muted);
    }

    .status-capsule.thinking {
      background: rgba(2, 132, 199, 0.1);
      border-color: rgba(2, 132, 199, 0.25);
      color: var(--accent-blue);
    }
    .status-capsule.thinking .pulse-dot {
      background-color: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .status-capsule.running {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.25);
      color: var(--accent-green);
    }
    .status-capsule.running .pulse-dot {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .status-capsule.ask {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
      color: #d97706;
    }
    .status-capsule.ask .pulse-dot {
      background-color: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
      animation: pulse 0.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .drag-handle {
      display: flex;
      align-items: center;
      gap: 3px;
      opacity: 0.35;
      padding: 0 4px;
    }
    .drag-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: currentColor;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 2px;
      -webkit-app-region: no-drag;
    }

    .btn-icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-icon:hover {
      background: var(--hover-bg);
      color: var(--text-main);
    }

    .btn-icon svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
    }

    /* Content Area */
    .content {
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow: hidden;
    }

    /* Unified Glass Stats Ribbon */
    .stats-ribbon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 4px;
    }

    .stat-pill {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
    }

    .stat-pill svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11px;
    }

    .stat-val {
      font-weight: 700;
      font-size: 12px;
      color: var(--text-main);
    }

    .stat-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent-green);
    }

    .stat-divider {
      width: 1px;
      height: 16px;
      background: var(--border-subtle);
    }

    /* Ask Question Alert Banner */
    .ask-card {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ask-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d97706;
      font-weight: 600;
      font-size: 11px;
    }

    .ask-header svg {
      width: 13px;
      height: 13px;
      stroke-width: 2;
    }

    .ask-title {
      font-size: 11.5px;
      color: var(--text-main);
      line-height: 1.4;
      font-weight: 500;
    }

    .ask-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 2px;
    }

    .ask-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ask-btn:hover {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    /* Activity Stream List */
    .activity-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }

    .section-title {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 11px;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: background 0.12s ease;
    }

    .activity-item:hover {
      background: var(--hover-bg);
    }

    .badge-tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }

    .badge-read { background: rgba(14, 165, 233, 0.12); color: var(--accent-blue); }
    .badge-edit { background: rgba(16, 185, 129, 0.12); color: var(--accent-green); }
    .badge-cmd { background: rgba(99, 102, 241, 0.12); color: #6366f1; }

    .activity-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
      font-size: 10.5px;
    }

    .metric-diff {
      font-size: 10px;
      font-weight: 600;
      margin-left: 2px;
      color: var(--accent-green);
    }

    /* Collapsed View (Mini Capsule) */
    .widget-container.collapsed {
      height: 36px;
    }
    .widget-container.collapsed .content {
      display: none;
    }
    .widget-container.collapsed .header {
      border-bottom: none;
      height: 36px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.2); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="widget-container" id="container">
    <!-- Header -->
    <div class="header">
      <div class="status-capsule idle" id="statusCapsule">
        <span class="pulse-dot" id="pulseDot"></span>
        <span id="statusText">待命中</span>
      </div>

      <div class="drag-handle">
        <span class="drag-dot"></span>
        <span class="drag-dot"></span>
        <span class="drag-dot"></span>
      </div>

      <div class="controls">
        <button class="btn-icon" id="btnFocus" title="聚焦主視窗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <button class="btn-icon" id="btnCollapse" title="折疊 / 展開">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" id="collapseIcon">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <button class="btn-icon" id="btnClose" title="隱藏浮窗 (Ctrl+Shift+W 喚醒)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Content -->
    <div class="content" id="contentArea">
      <!-- Unified Glass Stats Ribbon -->
      <div class="stats-ribbon">
        <!-- Read Files -->
        <div class="stat-pill" title="已探索 / 讀取檔案">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span class="stat-label">探索</span>
          <span class="stat-val" id="countRead">0</span>
        </div>

        <div class="stat-divider"></div>

        <!-- Edited Files & Diffs -->
        <div class="stat-pill" title="修改檔案與變更行數">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span class="stat-label">變更</span>
          <span class="stat-val" id="countEdit">0</span>
          <span class="stat-badge" id="diffBadge" style="display: none;">+0 -0</span>
        </div>

        <div class="stat-divider"></div>

        <!-- Commands Run -->
        <div class="stat-pill" title="執行終端指令次數">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
          <span class="stat-label">指令</span>
          <span class="stat-val" id="countCmd">0</span>
        </div>
      </div>

      <!-- Ask Question Alert (conditionally visible) -->
      <div class="ask-card" id="askCard" style="display: none;">
        <div class="ask-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span>等待確認決策</span>
        </div>
        <div class="ask-title" id="askTitle">正在等待您的回應...</div>
        <div class="ask-options" id="askOptions"></div>
      </div>

      <!-- Activity Stream List -->
      <div class="activity-section">
        <div class="section-title">
          <span>即時操作歷程</span>
          <span id="activityCount" style="font-weight: normal; opacity: 0.65;">0 項</span>
        </div>
        <div class="activity-list" id="activityList">
          <div class="activity-item" style="color: var(--text-muted); justify-content: center; font-style: italic;">
            尚無執行動作
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isCollapsed = false;
    let state = {
      status: 'idle',
      statusText: '待命中',
      readCount: 0,
      editCount: 0,
      addLines: 0,
      delLines: 0,
      cmdCount: 0,
      ask: null,
      activities: []
    };

    const container = document.getElementById('container');
    const statusCapsule = document.getElementById('statusCapsule');
    const statusText = document.getElementById('statusText');
    const countRead = document.getElementById('countRead');
    const countEdit = document.getElementById('countEdit');
    const diffBadge = document.getElementById('diffBadge');
    const countCmd = document.getElementById('countCmd');
    const askCard = document.getElementById('askCard');
    const askTitle = document.getElementById('askTitle');
    const askOptions = document.getElementById('askOptions');
    const activityList = document.getElementById('activityList');
    const activityCount = document.getElementById('activityCount');
    const btnCollapse = document.getElementById('btnCollapse');
    const collapseIcon = document.getElementById('collapseIcon');
    const btnClose = document.getElementById('btnClose');
    const btnFocus = document.getElementById('btnFocus');

    let ipc = null;
    try {
      if (window.require) {
        const electron = window.require('electron');
        ipc = electron.ipcRenderer;
      }
    } catch (_) {}

    function render() {
      // 1. Status Indicator
      statusCapsule.className = 'status-capsule ' + (state.status || 'idle');
      statusText.innerText = state.statusText || '待命中';

      // 2. Metrics
      countRead.innerText = String(state.readCount || 0);
      countEdit.innerText = String(state.editCount || 0);
      countCmd.innerText = String(state.cmdCount || 0);

      // Diff Badge
      if (state.addLines > 0 || state.delLines > 0) {
        diffBadge.style.display = 'inline-block';
        diffBadge.innerText = `+${state.addLines || 0} -${state.delLines || 0}`;
      } else {
        diffBadge.style.display = 'none';
      }

      // 3. Ask Question
      if (state.ask && state.ask.question && Array.isArray(state.ask.options) && state.ask.options.length > 0) {
        askCard.style.display = 'flex';
        askTitle.innerText = state.ask.question;
        askOptions.innerHTML = '';
        state.ask.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'ask-btn';
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:12px;height:12px;">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span>${escapeHtml(opt)}</span>
          `;
          btn.onclick = () => {
            if (typeof window['__ag_click_option_' + idx] === 'function') {
              window['__ag_click_option_' + idx]();
            }
            if (ipc) {
              ipc.send('ag-widget-answer-question', idx);
            }
          };
          askOptions.appendChild(btn);
        });
      } else {
        askCard.style.display = 'none';
      }

      // 4. Activities
      const acts = state.activities || [];
      activityCount.innerText = `${acts.length} 項`;
      if (acts.length > 0) {
        activityList.innerHTML = '';
        acts.slice(0, 10).forEach(act => {
          const item = document.createElement('div');
          item.className = 'activity-item';
          let badgeClass = 'badge-read';
          let tagText = 'READ';
          if (act.type === 'edit') {
            badgeClass = 'badge-edit';
            tagText = 'EDIT';
          } else if (act.type === 'cmd') {
            badgeClass = 'badge-cmd';
            tagText = 'CMD';
          }

          item.innerHTML = `
            <span class="badge-tag ${badgeClass}">${tagText}</span>
            <span class="activity-text" title="${escapeHtml(act.text)}">${escapeHtml(act.text)}</span>
            ${act.diff ? `<span class="metric-diff">${escapeHtml(act.diff)}</span>` : ''}
          `;
          activityList.appendChild(item);
        });
      } else {
        activityList.innerHTML = `
          <div class="activity-item" style="color: var(--text-muted); justify-content: center; font-style: italic;">
            尚無執行動作
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function toggleCollapse(forceVal) {
      isCollapsed = typeof forceVal === 'boolean' ? forceVal : !isCollapsed;
      if (isCollapsed) {
        container.classList.add('collapsed');
        collapseIcon.setAttribute('points', '18 15 12 9 6 15');
      } else {
        container.classList.remove('collapsed');
        collapseIcon.setAttribute('points', '6 9 12 15 18 9');
      }
      if (window.parent && window.parent.__ag_on_widget_collapse) {
        window.parent.__ag_on_widget_collapse(isCollapsed);
      }
      if (ipc) {
        ipc.send('ag-widget-toggle-collapse', isCollapsed);
      }
    }

    btnCollapse.onclick = () => toggleCollapse();
    btnClose.onclick = () => {
      if (window.parent && window.parent.__ag_on_widget_close) {
        window.parent.__ag_on_widget_close();
      }
      if (ipc) ipc.send('ag-widget-close');
    };
    btnFocus.onclick = () => {
      if (ipc) ipc.send('ag-widget-focus-main');
    };

    window.__ag_update_state = (data) => {
      if (data) {
        state = { ...state, ...data };
        if (data.isCollapsed !== undefined && data.isCollapsed !== isCollapsed) {
          toggleCollapse(data.isCollapsed);
        }
        render();
      }
    };

    if (ipc) {
      ipc.on('ag-widget-update', (event, data) => {
        window.__ag_update_state(data);
      });
    }

    render();
  </script>
</body>
</html>
